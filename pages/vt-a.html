<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>VT · página A</title>
<style>
  /* é ISTO que liga a transição entre documentos diferentes */
  @view-transition { navigation: auto; }

  ::view-transition-old(root){ animation: sai .35s cubic-bezier(.65,0,.35,1) both }
  ::view-transition-new(root){ animation: entra .45s cubic-bezier(.22,1,.36,1) both }
  @keyframes sai  { to { opacity:0; transform: translateX(-24px) } }
  @keyframes entra{ from { opacity:0; transform: translateX(24px) } }

  html,body{margin:0;height:100%}
  body{background:linear-gradient(140deg,#1a2440,#0d111d);color:#e9e9f2;
    font:14px/1.5 Inter,system-ui,sans-serif;display:grid;place-content:center;text-align:center;gap:10px}
  h1{margin:0;font-size:26px;letter-spacing:-.03em}
  p{margin:0;font-size:12px;color:#8b8ba4}
  a{display:inline-block;margin-top:8px;padding:9px 18px;border-radius:99px;background:#7dd3fc;
    color:#07121c;font-weight:700;font-size:12.5px;text-decoration:none}
  small{font-family:ui-monospace,monospace;font-size:9.5px;color:#55556b;letter-spacing:.1em}
</style>
</head>
<body>
  <h1>Página A</h1>
  <p>Documento 1 de 2 — navegação real, não SPA.</p>
  <a href="vt-b.html">Ir para B →</a>
  <small>@view-transition { navigation: auto }</small>
</body>
</html>
